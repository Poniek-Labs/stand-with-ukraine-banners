<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 800 52" width="100%" height="52">
  <!-- Background Dark Bar -->
  <rect width="100%" height="50" fill="#1a1a1a"/>
  
  <!-- Yellow Bottom Border Line -->
  <rect y="50" width="100%" height="2" fill="#ffd700"/>

  <!-- Centered Content Container Group -->
  <!-- Adjust the 'transform' X value if you need to manually re-center text lengths -->
  <g transform="translate(240, 17)">
    <!-- Ukraine Flag Image -->
    <g>
      <!-- Flag Background/Shadow Effect Box -->
      <rect width="24" height="16" rx="2" fill="#000000" opacity="0.3" transform="translate(0, 1)"/>
      <g clip-path="url(#flag-clip)">
        <!-- Blue Top Half -->
        <rect width="24" height="8" fill="#0057b7"/>
        <!-- Yellow Bottom Half -->
        <rect y="8" width="24" height="8" fill="#ffd700"/>
      </g>
    </g>

    <!-- Banner Text Content -->
    <text x="36" y="13" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14px">
      We stand with <tspan font-weight="bold">Ukraine</tspan>. <tspan fill="#ffd700" font-weight="600" text-decoration="underline">Learn how you can help</tspan>
    </text>
  </g>

  <!-- Flag Corner Radius Clip Configuration -->
  <defs>
    <clipPath id="flag-clip">
      <rect width="24" height="16" rx="2"/>
    </clipPath>
  </defs>
</svg>
